{% extends "base.html" %}

{% block title %}My Profile - SocialLite{% endblock %}

{% block styles %}
<style>
    .profile-header {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        margin-bottom: 30px;
    }

    .profile-banner {
        height: 180px;
        background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        opacity: 0.8;
    }

    .profile-avatar-overlay {
        position: absolute;
        top: 110px;
        left: 40px;
        z-index: 5;
    }

    .profile-avatar-overlay .avatar-placeholder,
    .profile-avatar-overlay img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid var(--bg-color);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        object-fit: cover;
    }

    .profile-details {
        padding: 70px 40px 30px 40px;
    }

    .post-grid-item {
        margin-bottom: 24px;
    }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px;">
    <!-- Profile Header Card -->
    <div class="glass-card profile-header animate-fade-in">
        <div class="profile-banner"></div>
        <div class="profile-avatar-overlay" id="profile-avatar-container"></div>
        
        <div class="profile-details">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h2 class="fw-bold m-0" id="profile-name"></h2>
                    <p class="text-secondary small mt-1" id="profile-email"></p>
                </div>
                <div>
                    <a href="/create-post" class="btn btn-gradient btn-sm">
                        <i class="fa-solid fa-square-plus me-1"></i> New Post
                    </a>
                </div>
            </div>
            
            <div class="mt-4">
                <h6 class="fw-semibold text-secondary small text-uppercase tracking-wider">Biography</h6>
                <p class="text-light m-0" id="profile-bio"></p>
            </div>
            
            <div class="d-flex gap-4 mt-4 text-center border-top border-dark pt-3">
                <div>
                    <h5 class="fw-bold m-0 text-light" id="posts-count">0</h5>
                    <small class="text-secondary small">Posts Shared</small>
                </div>
                <div>
                    <h5 class="fw-bold m-0 text-light" id="joined-date">-</h5>
                    <small class="text-secondary small">Member Since</small>
                </div>
            </div>
        </div>
    </div>

    <!-- My Posts List -->
    <h4 class="fw-bold text-light mb-4"><i class="fa-solid fa-images me-2 text-purple" style="color: #a855f7;"></i> My Posts</h4>
    
    <div id="profile-posts-list">
        <div class="text-center py-5">
            <div class="spinner-border text-purple" role="status" style="color: #a855f7;"></div>
            <p class="text-muted mt-2">Fetching your posts...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (!currentUser) return;
        
        // Render profile card details
        const avatarContainer = document.getElementById("profile-avatar-container");
        avatarContainer.innerHTML = currentUser.profileImageUrl 
            ? `<img src="${currentUser.profileImageUrl}" alt="avatar">` 
            : `<div class="avatar-placeholder d-flex align-items-center justify-content-center bg-purple text-white fw-bold fs-1">${currentUser.username[0].toUpperCase()}</div>`;
        
        document.getElementById("profile-name").innerText = currentUser.username;
        document.getElementById("profile-email").innerText = currentUser.email;
        document.getElementById("profile-bio").innerText = currentUser.bio || "No biography provided yet.";
        
        const memberDate = new Date(currentUser.createdDate).toLocaleDateString(undefined, { 
            year: 'numeric', month: 'long', day: 'numeric' 
        });
        document.getElementById("joined-date").innerText = memberDate;

        // Fetch all posts and filter to show only this user's posts
        loadUserPosts();

        async function loadUserPosts() {
            const list = document.getElementById("profile-posts-list");
            
            try {
                const response = await fetch("/api/posts", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                
                if (!response.ok) throw new Error();
                const posts = await response.json();
                
                // Filter posts created by the current user
                const userPosts = posts.filter(post => post.userId === currentUser.userId);
                
                document.getElementById("posts-count").innerText = userPosts.length;
                list.innerHTML = "";
                
                if (userPosts.length === 0) {
                    list.innerHTML = `
                        <div class="glass-card p-5 text-center animate-fade-in">
                            <i class="fa-solid fa-feather fa-3x mb-3 text-muted"></i>
                            <h5 class="text-secondary">You haven't posted anything yet</h5>
                            <p class="text-muted small">Share your thoughts on the timeline to see them here.</p>
                            <a href="/create-post" class="btn btn-gradient btn-sm mt-2">Write First Post</a>
                        </div>
                    `;
                    return;
                }
                
                userPosts.forEach(post => {
                    const item = document.createElement("div");
                    item.className = "glass-card p-4 mb-4 animate-fade-in";
                    item.id = `post-${post.postId}`;
                    
                    const postImageHtml = post.imageUrl 
                        ? `<div class="mt-3 mb-2 rounded overflow-hidden" style="max-height: 350px;">
                             <img src="${post.imageUrl}" style="width:100%; max-height: 350px; object-fit:cover;" alt="post image">
                           </div>` 
                        : '';
                        
                    const formattedDate = new Date(post.createdDate).toLocaleDateString(undefined, { 
                        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });

                    item.innerHTML = `
                        <div class="d-flex align-items-center justify-content-between">
                            <small class="text-muted">${formattedDate}</small>
                            <button class="btn btn-sm btn-outline-danger border-0 rounded-circle" onclick="deletePost(${post.postId})">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <p class="text-light mt-2" style="font-size: 1.05rem; white-space: pre-wrap;">${post.content}</p>
                        ${postImageHtml}
                        <div class="d-flex gap-3 mt-3 align-items-center">
                            <span class="text-secondary small"><i class="fa-solid fa-heart text-danger me-1"></i> ${post.likesCount} Likes</span>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (err) {
                list.innerHTML = `<div class="glass-card p-4 text-center text-danger">Error loading posts.</div>`;
            }
        }

        window.deletePost = async function(postId) {
            if (!confirm("Are you sure you want to delete this post?")) return;
            
            try {
                const response = await fetch(`/api/posts/${postId}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    showAlert("Post deleted successfully!", "success");
                    document.getElementById(`post-${postId}`).remove();
                    // Decrement total count
                    const countElem = document.getElementById("posts-count");
                    countElem.innerText = parseInt(countElem.innerText) - 1;
                } else {
                    showAlert("Could not delete post.", "error");
                }
            } catch (err) {
                showAlert("Error connecting to server.", "error");
            }
        };
    });
</script>
{% endblock %}
