events {
    worker_connections 1024;
}

http {
    # Set standard logging and file types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define backend microservice upstream groups for clarity
    upstream auth_service {
        server auth-service:5001;
    }

    upstream post_service {
        server post-service:5002;
    }

    upstream comment_service {
        server comment-service:5003;
    }

    upstream media_service {
        server media-service:5004;
    }

    upstream frontend_service {
        server frontend:5000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Increase upload limit to support image uploads up to 10MB
        client_max_body_size 10M;

        # 1. Route /api/auth* to Auth Service (stripping the /api/auth prefix)
        location /api/auth {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route /api/posts* to Post Service (stripping the /api/posts prefix)
        location /api/posts {
            proxy_pass http://post_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route /api/comments* to Comment Service (stripping the /api/comments prefix)
        location /api/comments {
            proxy_pass http://comment_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Route /api/media* to Media Service (stripping the /api/media prefix)
        location /api/media {
            proxy_pass http://media_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Route all other requests (static/page views) to Frontend Service
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
