name: SocialLite Microservices CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Lint and Test Job (Syntax Validation)
  validate-code:
    name: Lint & Validate Code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    # Run quick syntax check across all Python code in the microservices
    - name: Run Lint Check
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 2. Docker Validation Job (Ensures each container compiles successfully)
  validate-docker:
    name: Build & Validate Dockerfiles
    runs-on: ubuntu-latest
    needs: validate-code
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-qemu-action@v3

    - name: Set up Docker Build
      uses: actions/setup-buildx-action@v3

    # Build each microservice image locally to verify they compile without deploying.
    # In a production pipeline, you would log in to Azure Container Registry (ACR) or DockerHub
    # and use `push: true` to publish the built images.
    - name: Build Auth Service Image
      uses: docker/build-push-action@v5
      with:
        context: ./auth-service
        push: false
        tags: auth-service:latest

    - name: Build Post Service Image
      uses: docker/build-push-action@v5
      with:
        context: ./post-service
        push: false
        tags: post-service:latest

    - name: Build Comment Service Image
      uses: docker/build-push-action@v5
      with:
        context: ./comment-service
        push: false
        tags: comment-service:latest

    - name: Build Media Service Image
      uses: docker/build-push-action@v5
      with:
        context: ./media-service
        push: false
        tags: media-service:latest

    - name: Build Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: frontend:latest
