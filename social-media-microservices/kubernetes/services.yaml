# This file defines the ClusterIP Services for all microservices.
# A ClusterIP Service assigns an internal virtual IP and DNS name to a set of Pods.
# Inter-service communication uses these DNS names, mapping HTTP port 80 to container ports.

# 1. Auth Service ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80           # Exposes standard port 80 internally
    targetPort: 5001   # Forwards request to container port 5001
    protocol: TCP
  selector:
    app: auth-service
---
