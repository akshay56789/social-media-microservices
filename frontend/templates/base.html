<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SocialLite - Microservices Learning{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Design Aesthetic (Premium Theme) -->
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 26, 46, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #8a2be2 0%, #4a00e0 100%);
            --secondary-gradient: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-glow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(138, 43, 226, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 127, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navbar-brand-custom {
            font-weight: 700;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(138, 43, 226, 0.3);
        }

        .nav-link-custom {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link-custom:hover, .nav-link-custom.active {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }

        .nav-link-custom.active i {
            color: #a855f7;
        }

        .btn-gradient {
            background: var(--primary-gradient);
            color: white;
            border: none;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.6rem 1.5rem;
            box-shadow: var(--accent-glow);
            transition: all 0.2s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
            color: white;
        }

        .btn-gradient-secondary {
            background: var(--secondary-gradient);
            color: white;
            border: none;
            font-weight: 600;
            border-radius: 12px;
            padding: 0.6rem 1.5rem;
            transition: all 0.2s ease;
        }

        .btn-gradient-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
            color: white;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #8a2be2;
            color: var(--text-primary);
            box-shadow: 0 0 0 4px rgba(138, 43, 226, 0.15);
        }

        /* Avatar styling */
        .avatar-placeholder {
            width: 45px;
            height: 45px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .avatar-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(138, 43, 226, 0.3);
        }

        /* Micro-animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .toast-container-custom {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1060;
        }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>

    <!-- Unified Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom border-dark py-3" style="background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px);">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom d-flex align-items-center gap-2" href="/feed">
                <i class="fa-solid fa-cloud-sun"></i> SocialLite
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2 mt-3 mt-lg-0">
                    <li class="nav-item" id="nav-login">
                        <a class="nav-link text-light" href="/login"><i class="fa-solid fa-sign-in-alt me-1"></i> Login</a>
                    </li>
                    <li class="nav-item" id="nav-register">
                        <a class="nav-link text-light" href="/register"><i class="fa-solid fa-user-plus me-1"></i> Register</a>
                    </li>
                    
                    <!-- Auth-only navigation items -->
                    <li class="nav-item d-none" id="nav-feed">
                        <a class="nav-link nav-link-custom" href="/feed"><i class="fa-solid fa-house"></i> Timeline</a>
                    </li>
                    <li class="nav-item d-none" id="nav-create">
                        <a class="nav-link nav-link-custom" href="/create-post"><i class="fa-solid fa-square-plus"></i> Share Post</a>
                    </li>
                    <li class="nav-item d-none" id="nav-profile">
                        <a class="nav-link nav-link-custom" href="/profile"><i class="fa-solid fa-user"></i> My Profile</a>
                    </li>
                    <li class="nav-item d-none ms-lg-3" id="nav-logout-container">
                        <button class="btn btn-outline-danger btn-sm px-3 rounded-pill" onclick="logout()">
                            <i class="fa-solid fa-power-off"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container py-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Alert toast elements -->
    <div class="toast-container-custom" id="toast-container"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Unified Authentication Helper & API Router -->
    <script>
        // Check if token exists in localStorage
        const token = localStorage.getItem("token");
        const currentUser = JSON.parse(localStorage.getItem("user"));

        // Global Nav Control based on authentication state
        document.addEventListener("DOMContentLoaded", function() {
            if (token && currentUser) {
                // User is logged in
                document.getElementById("nav-login")?.classList.add("d-none");
                document.getElementById("nav-register")?.classList.add("d-none");
                
                document.getElementById("nav-feed")?.classList.remove("d-none");
                document.getElementById("nav-create")?.classList.remove("d-none");
                document.getElementById("nav-profile")?.classList.remove("d-none");
                document.getElementById("nav-logout-container")?.classList.remove("d-none");
                
                // Highlight active link
                const currentPath = window.location.pathname;
                document.querySelectorAll(".nav-link-custom").forEach(link => {
                    if (link.getAttribute("href") === currentPath) {
                        link.classList.add("active");
                    }
                });
            } else {
                // User is not logged in, enforce login on private pages
                const privatePages = ["/feed", "/profile", "/create-post"];
                if (privatePages.includes(window.location.pathname)) {
                    window.location.href = "/login";
                }
            }
        });

        // Toast Alert System
        function showAlert(message, type = "info") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `glass-card p-3 mb-2 animate-fade-in border-start border-4 border-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'info'}`;
            toast.style.minWidth = "280px";
            toast.style.background = "rgba(20, 26, 46, 0.95)";
            
            let icon = 'fa-info-circle';
            if (type === 'success') icon = 'fa-check-circle';
            if (type === 'error') icon = 'fa-times-circle';

            toast.innerHTML = `
                <div class="d-flex align-items-center justify-content-between gap-3">
                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid ${icon} text-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'info'}"></i>
                        <span class="small fw-medium text-light">${message}</span>
                    </div>
                    <button type="button" class="btn-close btn-close-white btn-sm" onclick="this.parentElement.parentElement.remove()"></button>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        // Logout action
        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "/login";
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
