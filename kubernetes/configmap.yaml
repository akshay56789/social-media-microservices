apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  # Internal service DNS URLs for inter-service communication
  # Inside Kubernetes, service endpoints resolve to their ClusterIP using DNS
  # Format: http://<service-name>.<namespace>.svc.cluster.local:<port>
  AUTH_SERVICE_URL: "http://auth-service"
  POST_SERVICE_URL: "http://post-service"
  COMMENT_SERVICE_URL: "http://comment-service"
  MEDIA_SERVICE_URL: "http://media-service"
  AZURE_STORAGE_CONTAINER: "social-media-images"
