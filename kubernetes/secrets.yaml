apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
data:
  # Secrets in K8s are base64 encoded to avoid syntax issues.
  # The base64 values below are placeholder credentials for learning:
  
  # JWT_SECRET: "dev_secret_key_change_me_in_prod"
  JWT_SECRET: ZGV2X3NlY3JldF9rZXlfY2hhbmdlX21lX2luX3Byb2Q=

  # DB_CONNECTION_STRING (Optional, defaults to local SQLite if left empty in python code).
  # If connecting to Azure SQL, base64-encode your connection string here.
  # E.g. "Driver={ODBC Driver 18...}" -> Base64
  DB_CONNECTION_STRING: ""

  # AZURE_STORAGE_CONNECTION_STRING (Optional, defaults to local media folder if empty).
  # If connecting to Azure Blob Storage, base64-encode your connection string here.
  AZURE_STORAGE_CONNECTION_STRING: ""
