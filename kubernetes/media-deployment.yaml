apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-deployment
  namespace: default
  labels:
    app: media-service
spec:
  # 2 replicas will work seamlessly if Azure Blob Storage connection strings are provided!
  # If running in local fallback mode (local filesystem uploads) on a multi-node cluster, 
  # pods will not share the filesystem unless using a shared volume type like ReadWriteMany (e.g. NFS)
  # or scaling down to 1 replica. For local Kubernetes testing, emptyDir is sufficient.
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
      - name: media-service
        image: media-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5004
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        env:
        - name: PORT
          value: "5004"
        - name: UPLOAD_FOLDER
          value: "/app/uploads"
        - name: AZURE_STORAGE_CONTAINER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AZURE_STORAGE_CONTAINER
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AZURE_STORAGE_CONNECTION_STRING
        
        # Mount the upload volume
        volumeMounts:
        - name: media-storage
          mountPath: /app/uploads
          
        livenessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 10
          periodSeconds: 10
          
      # In local testing, we use an emptyDir volume which starts empty and is deleted with the pod.
      # For production, you'd mount a PersistentVolumeClaim or use Azure Blob Storage!
      volumes:
      - name: media-storage
        emptyDir: {}
